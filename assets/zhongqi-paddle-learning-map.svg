<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1020" width="1400" height="1020" role="img" aria-labelledby="title desc">
  <title id="title">众祺体育：从学习到选拍</title>
  <desc id="desc">以内容帮助用户理解打法，再将球拍选择与购买连接起来的思维导图。</desc>
  <defs>
    <style>
      text{font-family:"PingFang SC","Noto Sans SC",Arial,sans-serif}.eyebrow{font-size:15px;font-weight:700;letter-spacing:2px;fill:#2f6c45}.headline{font-size:56px;font-weight:800;letter-spacing:-3px;fill:#172018}.deck{font-size:22px;fill:#526052}.node-title{font-size:19px;font-weight:700;letter-spacing:-.6px;fill:#172018}.node-copy{font-size:13px;fill:#445044}.small{font-size:12px;fill:#526052}.center-title{font-size:24px;font-weight:800;letter-spacing:-1px;fill:#172018}.center-copy{font-size:14px;fill:#314235}
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#506451"/></marker>
  </defs>
  <rect width="1400" height="1020" fill="#f6f6f1"/>
  <text x="58" y="56" class="eyebrow">众祺体育 · 网站内容与选拍策略</text>
  <text x="58" y="118" class="headline">用户少猜一点，销售少解释一点。</text>
  <text x="58" y="152" class="deck">球拍选择很多，但不少人不知道自己该看什么。众祺先把打法讲明白，再把适合的拍子摆出来。</text>
  <rect x="28" y="184" width="1344" height="776" fill="#fff" stroke="#172018" stroke-width="2"/>
  <g transform="translate(0 170)">
    <path d="M410 405 C485 405 505 405 553 405" fill="none" stroke="#506451" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M847 405 C902 405 930 405 980 405" fill="none" stroke="#506451" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M700 520 C700 574 700 602 700 640" fill="none" stroke="#506451" stroke-width="2.2" marker-end="url(#arrow)"/>
    <path d="M212 318 C212 275 270 258 326 258" fill="none" stroke="#9aa39a" stroke-width="1.6"/><path d="M212 492 C212 538 270 554 326 554" fill="none" stroke="#9aa39a" stroke-width="1.6"/><path d="M1120 318 C1120 274 1170 258 1232 258" fill="none" stroke="#9aa39a" stroke-width="1.6"/><path d="M1120 492 C1120 538 1170 554 1232 554" fill="none" stroke="#9aa39a" stroke-width="1.6"/>
    <g><rect x="58" y="330" width="352" height="150" rx="8" fill="#172018"/><text x="84" y="367" fill="#fff" class="node-title">问题：每次都得从头解释</text><text x="84" y="397" fill="#fff" class="node-copy">用户分不清入门、进阶和竞赛拍，</text><text x="84" y="419" fill="#fff" class="node-copy">也不懂控制、力量和容错该怎么选。</text><text x="84" y="452" fill="#dfffa0" class="small">销售只能一遍遍讲同一套话</text></g>
    <g><rect x="250" y="188" width="256" height="106" rx="8" fill="#eef1ea" stroke="#172018"/><text x="270" y="222" class="node-title">用户在想什么</text><text x="270" y="247" class="node-copy">“我到底该用哪支？”</text><text x="270" y="269" class="node-copy">“贵一点真的适合我吗？”</text></g>
    <g><rect x="250" y="514" width="256" height="106" rx="8" fill="#eef1ea" stroke="#172018"/><text x="270" y="548" class="node-title">销售卡在哪里</text><text x="270" y="573" class="node-copy">每次咨询都要重讲，</text><text x="270" y="595" class="node-copy">用户也很难立刻下决定。</text></g>
    <g><rect x="553" y="282" width="294" height="238" rx="12" fill="#b8f23d" stroke="#172018" stroke-width="2"/><text x="580" y="329" class="center-title">众祺匹克球俱乐部</text><text x="580" y="359" class="center-copy">先讲打法，再聊球拍。</text><text x="580" y="381" class="center-copy">先知道自己在练什么，</text><line x1="580" y1="405" x2="818" y2="405" stroke="#172018"/><text x="580" y="438" class="node-copy">再去看什么样的拍子能帮上忙。</text><text x="580" y="464" class="node-title">“你下一步想把哪一拍打好？”</text></g>
    <g><rect x="980" y="330" width="362" height="150" rx="8" fill="#2f6c45"/><text x="1006" y="367" fill="#fff" class="node-title">结果：用户自己也能做判断</text><text x="1006" y="397" fill="#fff" class="node-copy">看懂取舍，找到更合适的球拍，</text><text x="1006" y="419" fill="#fff" class="node-copy">再去看详情或到京东购买。</text><text x="1006" y="452" fill="#e7ffb8" class="small">销售经验变成网站里的说明和选择</text></g>
    <g><rect x="1150" y="188" width="204" height="106" rx="8" fill="#eef6df" stroke="#2f6c45"/><text x="1170" y="222" class="node-title">对用户</text><text x="1170" y="247" class="node-copy">知道为什么选它</text><text x="1170" y="269" class="node-copy">买得更踏实</text></g>
    <g><rect x="1150" y="514" width="204" height="106" rx="8" fill="#eef6df" stroke="#2f6c45"/><text x="1170" y="548" class="node-title">对团队</text><text x="1170" y="573" class="node-copy">少讲重复的话</text><text x="1170" y="595" class="node-copy">把内容慢慢做厚</text></g>
    <g><rect x="316" y="620" width="768" height="136" rx="10" fill="#fff" stroke="#172018" stroke-width="1.5"/><text x="346" y="655" class="node-title">三条路，各做各的事</text><text x="346" y="688" class="node-copy">① 知识文章：看懂一项技术和球拍特性的关系　　② 商城：直接浏览、比较和购买</text><text x="346" y="712" class="node-copy">③ 选拍攻略：4 题匹配，再调一点，再给 3 支建议</text><text x="346" y="738" class="small">文章页直接放两到三支相关球拍；完整选拍攻略放在商城顶部。</text></g>
  </g>
  <text x="58" y="990" font-size="15" fill="#526052">内容不是为了把网站做得热闹。它先帮用户弄清自己在练什么，再把合适的装备放到眼前。</text>
</svg>
