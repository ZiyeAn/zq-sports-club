<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">众祺体育项目架构图</title>
  <desc id="desc">众祺匹克球俱乐部的运营、内容、选拍与网站内购买架构。</desc>
  <style>
    text{font-family:"PingFang SC","Noto Sans SC",Arial,sans-serif;fill:#111}.small{font-size:13px;letter-spacing:1.3px}.nav{font-size:16px;font-weight:700}.section{font-size:18px;font-weight:700}.title{font-size:28px;font-weight:800;letter-spacing:-1px}.copy{font-size:15px;fill:#555}.box-title{font-size:22px;font-weight:800}.box-copy{font-size:15px;fill:#444}.white{fill:#fff}.white-copy{fill:#eee}.fine{stroke:#111;stroke-width:1.5;fill:none}.arrow{stroke:#111;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L8 4.5L0 9Z" fill="#111"/></marker></defs>
  <rect width="1600" height="1000" fill="#f6f5ef"/>
  <g transform="translate(58 24)"><circle cx="20" cy="20" r="18" fill="#111"/><path d="M8 20c8-11 16-11 24 0-8 11-16 11-24 0Zm6 0c4 5 8 5 12 0-4-5-8-5-12 0Z" fill="#f6f5ef"/><text x="52" y="25" class="title">众祺体育</text><text x="53" y="46" class="small">PICKLEBALL CLUB　·　匹克球俱乐部</text></g>
  <rect x="1398" y="25" width="144" height="42" fill="#d7ef51" stroke="#111" stroke-width="1.5"/><text x="1414" y="51" class="nav">项目架构图</text>
  <line x1="0" y1="91" x2="1600" y2="91" class="fine"/>

  <text x="100" y="165" class="section">01 / 运营与发布</text>
  <text x="720" y="165" class="section">02 / 公开网站与转化</text>
  <text x="1320" y="165" class="section">03 / 购买结果</text>

  <rect x="100" y="205" width="500" height="242" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="130" y="244" class="box-title">运营团队</text><text x="130" y="276" class="box-copy">内容编辑　商品运营　管理员</text>
  <line x1="125" y1="300" x2="575" y2="300" class="fine"/>
  <text x="130" y="330" class="box-copy">文章、术语、赛事、球拍、人民币价格、</text><text x="130" y="354" class="box-copy">网站内购买入口与 Club Edits，都在后台维护。</text>
  <rect x="130" y="381" width="130" height="35" fill="#111"/><text x="148" y="404" class="nav white">Strapi 后台</text>
  <line x1="260" y1="398" x2="310" y2="398" class="arrow"/><text x="329" y="403" class="copy">发布触发器</text>
  <line x1="435" y1="398" x2="480" y2="398" class="arrow"/><text x="500" y="403" class="copy">Astro 构建</text>

  <rect x="645" y="205" width="360" height="242" fill="#111"/>
  <text x="675" y="250" style="fill:#fff" class="box-title">先讲打法，再聊球拍</text>
  <text x="675" y="287" style="fill:#eee" class="box-copy">把销售经验变成用户看得懂的内容。</text>
  <text x="675" y="318" style="fill:#eee" class="box-copy">先知道自己在练什么，</text><text x="675" y="342" style="fill:#eee" class="box-copy">再去看什么样的拍子能帮上忙。</text>
  <line x1="675" y1="368" x2="975" y2="368" stroke="#fff"/>
  <text x="675" y="397" style="fill:#eee" class="box-copy">知识帮助理解 · 选拍降低门槛</text><text x="675" y="422" style="fill:#eee" class="box-copy">站内购买完成转化</text>

  <rect x="1050" y="205" width="450" height="242" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1080" y="244" class="box-title">中国大陆稳定访问</text>
  <text x="1080" y="276" class="box-copy">COS 托管网站文件与媒体</text><text x="1080" y="302" class="box-copy">EdgeOne / CDN 分发给大陆访客</text>
  <line x1="1075" y1="326" x2="1475" y2="326" class="fine"/>
  <text x="1080" y="356" class="box-copy">正式域名 + ICP 备案</text><text x="1080" y="382" class="box-copy">发布失败时，上一版网站继续可访问。</text>
  <text x="1430" y="410" class="title">↗</text>

  <path d="M600 326H645" class="arrow"/><path d="M1005 326H1050" class="arrow"/>
  <path d="M825 447V535" class="arrow"/>
  <text x="100" y="535" class="section">网站设计策略：内容、选拍与购买共用一条路径</text>

  <rect x="100" y="590" width="420" height="185" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="130" y="632" class="box-title">知识内容</text><text x="130" y="668" class="box-copy">技术文章讲清楚：练什么、为什么练，</text><text x="130" y="692" class="box-copy">以及相应的球拍特性。</text><text x="130" y="735" class="box-copy">文章底部直接出现 2–3 支相关球拍。</text>
  <rect x="590" y="590" width="420" height="185" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="620" y="632" class="box-title">选拍攻略</text><text x="620" y="668" class="box-copy">4 个简单问题 → 3 支建议。</text><text x="620" y="692" class="box-copy">“再调一点”微调偏好，雷达图只说明。</text><text x="620" y="735" class="box-copy">不让用户手动调复杂参数。</text>
  <rect x="1080" y="590" width="420" height="185" fill="#fff" stroke="#111" stroke-width="1.5"/>
  <text x="1110" y="632" class="box-title">商城与网站内购买</text><text x="1110" y="668" class="box-copy">浏览、比较产品，查看球拍详情。</text><text x="1110" y="692" class="box-copy">显示后台维护的人民币价格。</text><text x="1110" y="735" class="box-copy">在网站内完成购买，而不是导向外部平台。</text>
  <path d="M520 683H590" class="arrow"/><path d="M1010 683H1080" class="arrow"/>

  <line x1="100" y1="872" x2="1500" y2="872" class="fine"/>
  <text x="100" y="918" class="title">项目最终要解决的事</text>
  <text x="100" y="950" class="copy">让用户更容易理解自己适合什么；让销售经验能被内容持续复用；让购买发生在已经建立理解之后。</text>
</svg>
