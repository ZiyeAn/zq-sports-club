<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>众祺体育 · 从学习到选拍</title>
  <style>
    :root{--paper:#f6f6f1;--ink:#172018;--muted:#526052;--green:#2f6c45;--lime:#b8f23d;--line:#9aa39a;--panel:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC","PingFang SC",system-ui,sans-serif}.wrap{max-width:1440px;margin:0 auto;padding:42px clamp(18px,4vw,64px) 52px}.eyebrow{font-size:12px;letter-spacing:.1em;color:var(--green);font-weight:700}.title{margin:8px 0 8px;font-size:clamp(32px,4vw,58px);line-height:1.05;letter-spacing:-.06em}.deck{margin:0;max-width:58ch;color:var(--muted);line-height:1.7}.map{margin-top:32px;background:var(--panel);border:2px solid var(--ink);overflow:auto}.map svg{display:block;width:100%;min-width:1060px;height:auto}.node-title{font-size:19px;font-weight:700;letter-spacing:-.04em}.node-copy{font-size:13px;fill:#445044}.small{font-size:12px;fill:#526052}.center-title{font-size:24px;font-weight:800;letter-spacing:-.055em}.center-copy{font-size:14px;fill:#314235}.caption{display:flex;gap:18px;flex-wrap:wrap;margin-top:17px;font-size:13px;color:var(--muted)}.key{display:inline-flex;gap:7px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.dot.problem{background:#172018}.dot.solution{background:#b8f23d;border:1px solid #172018}.dot.result{background:#2f6c45}.prompt{margin-top:30px;padding:18px 20px;border-left:4px solid var(--green);background:#edf2ea;font-size:15px;line-height:1.65}.prompt b{color:var(--green)}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">DRAFT · WEBSITE STORY MAP</div>
    <h1 class="title">用户少猜一点，销售少解释一点。</h1>
    <p class="deck">球拍选择很多，但不少人不知道自己该看什么。众祺先把打法讲明白，再把适合的拍子摆出来。</p>
    <section class="map" aria-label="众祺体育从学习到选拍思维导图">
      <svg viewBox="0 0 1400 800" role="img" aria-labelledby="map-title map-desc">
        <title id="map-title">众祺体育从学习到选拍</title><desc id="map-desc">销售难题通过学习文章、独立选拍攻略和文章页推荐，变成更容易理解的购买过程</desc>
        <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#506451"/></marker></defs>
        <path d="M410 405 C485 405 505 405 553 405" fill="none" stroke="#506451" stroke-width="2.2" marker-end="url(#arrow)"/>
        <path d="M847 405 C902 405 930 405 980 405" fill="none" stroke="#506451" stroke-width="2.2" marker-end="url(#arrow)"/>
        <path d="M700 520 C700 574 700 602 700 640" fill="none" stroke="#506451" stroke-width="2.2" marker-end="url(#arrow)"/>
        <path d="M212 318 C212 275 270 258 326 258" fill="none" stroke="#9aa39a" stroke-width="1.6"/>
        <path d="M212 492 C212 538 270 554 326 554" fill="none" stroke="#9aa39a" stroke-width="1.6"/>
        <path d="M1120 318 C1120 274 1170 258 1232 258" fill="none" stroke="#9aa39a" stroke-width="1.6"/>
        <path d="M1120 492 C1120 538 1170 554 1232 554" fill="none" stroke="#9aa39a" stroke-width="1.6"/>
        <g><rect x="58" y="330" width="352" height="150" rx="8" fill="#172018"/><text x="84" y="367" fill="#fff" class="node-title">问题：每次都得从头解释</text><text x="84" y="397" fill="#fff" class="node-copy">用户分不清入门、进阶和竞赛拍，</text><text x="84" y="419" fill="#fff" class="node-copy">也不懂控制、力量和容错该怎么选。</text><text x="84" y="452" fill="#dfffa0" class="small">销售只能一遍遍讲同一套话</text></g>
        <g><rect x="250" y="188" width="256" height="106" rx="8" fill="#eef1ea" stroke="#172018"/><text x="270" y="222" class="node-title">用户在想什么</text><text x="270" y="247" class="node-copy">“我到底该用哪支？”</text><text x="270" y="269" class="node-copy">“贵一点真的适合我吗？”</text></g>
        <g><rect x="250" y="514" width="256" height="106" rx="8" fill="#eef1ea" stroke="#172018"/><text x="270" y="548" class="node-title">销售卡在哪里</text><text x="270" y="573" class="node-copy">每次咨询都要重讲，</text><text x="270" y="595" class="node-copy">用户也很难立刻下决定。</text></g>
        <g><rect x="553" y="282" width="294" height="238" rx="12" fill="#b8f23d" stroke="#172018" stroke-width="2"/><text x="580" y="329" class="center-title">众祺匹克球俱乐部</text><text x="580" y="359" class="center-copy">先讲打法，再聊球拍。</text><text x="580" y="381" class="center-copy">先知道自己在练什么，</text><line x1="580" y1="405" x2="818" y2="405" stroke="#172018" stroke-width="1"/><text x="580" y="438" class="node-copy">再去看什么样的拍子能帮上忙。</text><text x="580" y="464" class="node-title">“你下一步想把哪一拍打好？”</text></g>
        <g><rect x="980" y="330" width="362" height="150" rx="8" fill="#2f6c45"/><text x="1006" y="367" fill="#fff" class="node-title">结果：用户自己也能做判断</text><text x="1006" y="397" fill="#fff" class="node-copy">看懂取舍，找到更合适的球拍，</text><text x="1006" y="419" fill="#fff" class="node-copy">再去看详情或到京东购买。</text><text x="1006" y="452" fill="#e7ffb8" class="small">销售经验变成网站里的说明和选择</text></g>
        <g><rect x="1150" y="188" width="204" height="106" rx="8" fill="#eef6df" stroke="#2f6c45"/><text x="1170" y="222" class="node-title">对用户</text><text x="1170" y="247" class="node-copy">知道为什么选它</text><text x="1170" y="269" class="node-copy">买得更踏实</text></g>
        <g><rect x="1150" y="514" width="204" height="106" rx="8" fill="#eef6df" stroke="#2f6c45"/><text x="1170" y="548" class="node-title">对团队</text><text x="1170" y="573" class="node-copy">少讲重复的话</text><text x="1170" y="595" class="node-copy">把内容慢慢做厚</text></g>
        <g><rect x="316" y="640" width="768" height="116" rx="10" fill="#fff" stroke="#172018" stroke-width="1.5"/><text x="346" y="675" class="node-title">三条路，各做各的事</text><text x="346" y="711" class="node-copy">① 知识文章：看懂一项技术和球拍特性的关系　　② 商城：直接浏览、比较和购买　　③ 选拍攻略：4 题匹配，再调一点，再给 3 支建议</text><text x="346" y="735" class="small">文章页直接放两到三支相关球拍；完整选拍攻略放在商城顶部。</text></g>
      </svg>
    </section>
    <div class="caption"><span class="key"><i class="dot problem"></i> 原始问题</span><span class="key"><i class="dot solution"></i> 众祺的产品策略</span><span class="key"><i class="dot result"></i> 用户与业务结果</span></div>
    <div class="prompt"><b>这张图想说的事：</b>内容不是为了把网站做得热闹。它先帮用户弄清自己在练什么，再把合适的装备放到眼前。销售人员的经验，也就不用每次从头讲起。</div>
  </main>
</body>
</html>
